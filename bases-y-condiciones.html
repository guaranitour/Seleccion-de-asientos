<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Bases y Condiciones — Destino Guaraní</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<!--
  Este archivo existe SOLO para que WhatsApp, Facebook, Telegram, etc.
  (crawlers que NO ejecutan JavaScript) lean meta tags og:* propios para
  esta URL puntual. La SPA real es index.html; ahí los og:* son fijos y
  genéricos porque todo el ruteo pasa por JS, así que un crawler que lea
  index.html siempre ve el mismo preview sin importar la ruta visitada.

  Un humano que abra este link en el navegador es redirigido de inmediato
  a la vista real de Bases y Condiciones dentro de la SPA. El redirect es
  vía JS a propósito: los crawlers de previsualización no lo ejecutan, así
  que siguen viendo estos meta tags — solo las personas navegan de acá.
-->

<!-- Previsualización al compartir este link específico -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.guaranitour.com/bases-y-condiciones.html">
<meta property="og:title" content="Bases y Condiciones — Destino Guaraní">
<meta property="og:description" content="Confirmá tu aceptación de las Bases y Condiciones del viaje en menos de 2 minutos.">
<meta property="og:image" content="https://www.guaranitour.com/BYC_IMAGEN.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bases y Condiciones — Destino Guaraní">
<meta name="twitter:description" content="Confirmá tu aceptación de las Bases y Condiciones del viaje en menos de 2 minutos.">
<meta name="twitter:image" content="https://www.guaranitour.com/BYC_IMAGEN.png">

<!-- Redirect inmediato a la SPA real, ruta "/bases-y-condiciones".
     IMPORTANTE: no redirigimos a "/bases-y-condiciones" (sin .html):
     GitHub Pages puede resolver esa URL sirviendo este mismo archivo de
     nuevo (coincide por nombre), lo que dispara este mismo script otra
     vez → bucle infinito. En cambio, guardamos la ruta destino igual que
     hace 404.html y mandamos directo a index.html — ese archivo, al
     arrancar, restaura la ruta con replaceState() y routeTo() (en
     main.js) la resuelve normalmente, sin volver a pasar por acá. -->
<script>
  sessionStorage.setItem('gh-pages-redirect', '/bases-y-condiciones');
  location.replace('/');
</script>

<!-- Fallback sin JS (crawlers no llegan hasta acá; personas sin JS sí) -->
<meta http-equiv="refresh" content="0; url=/">
</head>
<body>
  <p>Redirigiendo a Bases y Condiciones… si no sos redirigido automáticamente,
     <a href="/">tocá acá</a>.</p>
</body>
</html>
