<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Selección de Asientos</title>
<!--
  GitHub Pages sirve este archivo para cualquier ruta que no exista como
  archivo real (por ejemplo /Panel/Editor/ViajeX). Como la SPA usa History
  API, esas rutas son válidas para la app aunque no exista un archivo físico.

  Guardamos la ruta pedida en sessionStorage y redirigimos a index.html.
  index.html, al arrancar, la recupera con history.replaceState() y deja
  al router de la app manejarla — todo esto pasa antes de que se pinte
  nada, así que no se ve ningún parpadeo ni redirect visible en la URL.
-->
<script>
  sessionStorage.setItem('gh-pages-redirect', location.pathname + location.search + location.hash);
  location.replace('/');
</script>
</head>
<body></body>
</html>
